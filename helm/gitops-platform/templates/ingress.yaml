{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: gitops-platform

spec:
  ingressClassName: traefik

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-platform
                port:
                  number: {{ .Values.service.port }}

{{- end }}