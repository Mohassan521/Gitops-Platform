name: Build and Push Image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
     
      
      - name: Build Docker Image
        run: docker build -f Dockerfile --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }} -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitops-platform:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitops-platform:${{ github.sha }}

      - name: Update Helm Image tag
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|" helm/gitops-platform/values.yaml

      - name: Commit updated helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/gitops-platform/values.yaml
          git commit -m "chore: deploy ${{ github.sha }}"
          git push

