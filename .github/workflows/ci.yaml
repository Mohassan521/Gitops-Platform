name: Build and Push Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
     
      
      - name: Build Docker Image
        run: docker build -f Dockerfile -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitops-platform:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitops-platform:${{ github.sha }}