name: Onboard Application

on:
  workflow_dispatch:
    inputs:
      repo_url:
        required: true
        type: string

      branch:
        required: true
        default: main
        type: string

      app_name:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  onboard:
    runs-on: ubuntu-latest

    steps:
      - name: Extract repository
        id: repo
        run: |
          REPO="${{ inputs.repo_url }}"
          REPO="${REPO#https://github.com/}"
          REPO="${REPO%.git}"

          echo "repository=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout developer repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo.outputs.repository }}
          ref: ${{ inputs.branch }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize app name
        id: app
        run: |
          APP_NAME=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-')

          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ steps.app.outputs.name }}:${{ github.run_id }} .

      - name: Push image
        run: |
          docker push \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ steps.app.outputs.name }}:${{ github.run_id }}